<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento confirmado | Vieira's Barbershop</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>

        <nav>

            <a href="index.html">
                <img
                    src="imagens/logo-branca.jpeg"
                    alt="Logo da Vieira's Barbershop"
                >
            </a>

            <ul>

                <li>
                    <a href="index.html">
                        Serviços
                    </a>
                </li>

                <li>
                    <a href="agendamento.html">
                        Agendar
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>
    <section aria-labelledby="titulo-confirmacao">

        <header>
            <h1 id="titulo-confirmacao">Agendamento confirmado!</h1>
            <p>Seu horário foi reservado com sucesso.</p>
        </header>

        <section aria-labelledby="titulo-detalhes">
            <h2 id="titulo-detalhes">Detalhes do agendamento</h2>

            <p>
                <strong>Data:</strong>
                <span id="confirmacao-data">Carregando...</span>
            </p>

            <p>
                <strong>Horário:</strong>
                <span id="confirmacao-horario">Carregando...</span>
            </p>

            <p>
                <strong>Serviços:</strong>
            </p>

            <ul id="confirmacao-servicos">
                <li>Carregando...</li>
            </ul>

            <p>
                <strong>Total:</strong>
                <span id="confirmacao-total">Carregando...</span>
            </p>
        </section>

        <a href="index.html">Voltar para os serviços</a>

    </section>
</main>

    <footer>

        <p>
            &copy; 2026 Vieira's Barbershop.
            Todos os direitos reservados.
        </p>

    </footer>


    <script src="JS/confirmacao.js"></script>

</body>

</html>
