<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar agendamento | Vieira's Barbershop</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>

        <nav>

            <a href="index.html">
                <img src="imagens/logo-branca.jpeg" alt="Logo da Vieira's Barbershop">
            </a>

            <ul>
                <li>
                    <a href="index.html">Serviços</a>
                </li>

                <li>
                    <a href="agendamento.html">Agendar</a>
                </li>
            </ul>

        </nav>

    </header>

    <main>

        <section aria-labelledby="titulo-finalizacao">

            <header>
                <h1 id="titulo-finalizacao">
                    Confira seu agendamento
                </h1>

                <p>
                    Verifique as informações antes de confirmar.
                </p>
            </header>

            <section aria-labelledby="titulo-resumo">

                <h2 id="titulo-resumo">
                    Resumo do agendamento
                </h2>

                <article>

                    <h3>Serviços</h3>

                    <ul id="resumo-servicos">
                        <li>Carregando...</li>
                    </ul>

                </article>

                <article>

                    <h3>Data</h3>

                    <p id="resumo-data">
                        Carregando...
                    </p>

                </article>

                <article>

                    <h3>Horário</h3>

                    <p id="resumo-horario">
                        Carregando...
                    </p>

                </article>

                <article>

                    <h3>Duração</h3>

                    <p id="resumo-duracao">
                        Carregando...
                    </p>

                </article>

                <article>

                    <h3>Total</h3>

                    <p id="resumo-total">
                        Carregando...
                    </p>

                </article>

            </section>

            <button
                type="button"
                id="confirmar-agendamento"
            >
                Confirmar agendamento
            </button>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Vieira's Barbershop.
            Todos os direitos reservados.
        </p>
    </footer>

    <script src="JS/finalizacao.js"></script>

</body>

</html>
