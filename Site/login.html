<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Identificação | Vieira's Barbershop</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>
        <nav>
            <a href="login.html">
                <img src="imagens/logo-branca.jpeg" alt="Logo da Vieira's Barbershop">
            </a>
        </nav>
    </header>

    <main>

        <section aria-labelledby="titulo-login">

            <header>
                <h1 id="titulo-login">
                    Identifique-se
                </h1>

                <p>
                    Informe seus dados para acessar a barbearia.
                </p>
            </header>

            <form id="form-login">

                <fieldset>

                    <legend>Dados do cliente</legend>

                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel"
                        required>

                </fieldset>

                <button type="submit">
                    Acessar
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Vieira's Barbershop.
            Todos os direitos reservados.
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="JS/supabase.js"></script>

    <script src="JS/login.js"></script>
</body>

</html>
